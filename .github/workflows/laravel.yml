name: CI

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3, zip
        coverage: none
        tools: composer:v2

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        git config --global --unset-all http.https://github.com/.extraheader || true
        git config --global --remove-section url."https://github.com/" || true
        composer config --no-plugins audit.block-insecure false || true
        composer update --no-interaction --no-progress --prefer-dist 2>&1 | tee /tmp/composer-install.log
        status=${PIPESTATUS[0]}
        if [ $status -ne 0 ]; then
          {
            echo "### Composer install failure (${{ matrix.php-version }})"
            echo '```'
            tail -80 /tmp/composer-install.log
            echo '```'
          } > /tmp/composer-comment.md
          gh pr comment 5 --repo Azouar2418/KNR --body-file /tmp/composer-comment.md || true
          exit $status
        fi

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Lint PHP files
      run: find app bootstrap config database routes tests themes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

    - name: Execute tests
      env:
        APP_ENV: testing
        DB_CONNECTION: sqlite
        DB_DATABASE: ":memory:"
        CACHE_DRIVER: array
        MAIL_MAILER: array
        QUEUE_CONNECTION: sync
        SESSION_DRIVER: array
      run: php artisan test --exclude-group=external

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build default theme
      run: npm run build:default
